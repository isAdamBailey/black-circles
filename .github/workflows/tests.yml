name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Pest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pdo_mysql
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Run Pest
        run: ./vendor/bin/pest

  frontend:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Run Vitest
        working-directory: frontend
        run: npm run test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install root npm dependencies
        run: npm ci

      - name: Install frontend npm dependencies
        working-directory: frontend
        run: npm ci

      - name: Copy environment file
        run: cp .env.example .env

      - name: Configure environment for e2e
        run: |
          echo "DISCOGS_USERNAME=e2e-test-user" >> .env
          echo "SCOUT_DRIVER=collection" >> .env
          echo "FRONTEND_URL=http://localhost:3000" >> .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Start Sail
        run: ./vendor/bin/sail up -d --wait

      - name: Migrate and seed
        run: |
          ./vendor/bin/sail artisan migrate --force
          ./vendor/bin/sail artisan db:seed --class="Database\Seeders\E2eSeeder" --force

      - name: Build Nuxt
        working-directory: frontend
        run: npm run build
        env:
          NUXT_PUBLIC_API_BASE: http://localhost/api/v1

      - name: Serve Nuxt build
        working-directory: frontend
        run: node .output/server/index.mjs &
        env:
          PORT: 3000

      - name: Wait for Nuxt server
        run: npx wait-on http://localhost:3000

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Stop Sail
        if: always()
        run: ./vendor/bin/sail down
